<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="{{ page.summary | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M' }}">
  <script defer src="{{ '/assets/js/main.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M' }}"></script>
</head>
<body>
  <header>
    <div class="top"></div>
    <div class="nav">
      <a class="brand" href="{{ '/' | relative_url }}">WORLD IN CONTEXT<small>A FIELD ATLAS OF CONNECTION AND DISTANCE</small></a>
      <nav>
        <a href="{{ '/daily-affairs/index.html' | relative_url }}">Daily</a>
        <a href="{{ '/countries/index.html' | relative_url }}">Countries</a>
        <a href="{{ '/research/index.html' | relative_url }}">Perspective</a>
        <a href="{{ '/global-issues/index.html' | relative_url }}">Market</a>
        <a href="{{ '/research/index.html#commentary' | relative_url }}">Comment</a>
      </nav>
    </div>
  </header>
  <main class="wrap">{{ content }}</main>
  <footer>
    <div class="wrap">
      <div><strong>WORLD IN CONTEXT</strong><br><small>Historical atlas · Sources and interpretations</small></div>
      <a href="{{ '/sources/index.html' | relative_url }}">Sources &amp; research standards</a>
    </div>
  </footer>
</body>
</html>
