- year: 1492
  date: 1492 onward
  period: Atlantic crossings
  title: Exchange, conquest and forced movement
  copy: Sustained Atlantic crossings joined the Americas, Europe and Africa in new circuits. Plants and animals travelled in both directions, while conquest, epidemics and the forced enslavement and transport of millions shaped the exchange.
  routes_label: The Americas · Europe · West Africa
  source_title: The Columbian Exchange · Smithsonian Libraries
  source_url: https://www.si.edu/object/1493-uncovering-new-world-columbus-created-charles-c-mann%3Asiris_sil_979693
