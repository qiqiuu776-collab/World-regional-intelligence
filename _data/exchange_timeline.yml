- year: 1565
  date: 1565 onward
  period: Trans-Pacific links
  title: Silver west, silk east
  copy: Manila–Acapulco galleons joined Asian markets to the Americas across the Pacific. Chinese merchants in Manila linked silk and ceramics to American silver; the route also rested on Spanish colonial power.
