- year: 1995
  date: 1995 onward
  period: Rules for a wider trading system
  title: The WTO begins work
  copy: The World Trade Organization succeeded the postwar GATT system and added rules covering services and intellectual property as well as goods. The rules formalized global commerce, but participation and benefits remained uneven.
  routes_label: Europe · North America · East Asia
  source_title: History of the multilateral trading system · WTO
