- year: -200
  date: 2nd century BCE
  period: Eurasian corridors
  title: Routes across inner Asia
  copy: Overland and maritime routes gradually linked East Asia, Central Asia, South Asia and western Eurasia. Along these networks, goods, technologies, knowledge and religions moved. Merchants usually travelled sections; there was no single road or unified system.
