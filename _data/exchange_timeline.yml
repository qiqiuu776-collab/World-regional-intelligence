- year: 2024
  date: 2024–2026
  period: Selective connection
  title: Trade reroutes; ties do not simply disappear
  copy: Global trade reached a record in 2025 even as policy barriers and geopolitical tensions redirected some links. UN Trade and Development reports China–U.S. trade fell by more than 20% since 2024; East Asian supply networks and Africa–Europe export links continued to grow. This is selective fragmentation, not a uniform retreat from global exchange.
  routes_label: China–U.S. · East Asia · Africa–Europe
  source_title: Trade and Development Report 2026 · UN Trade and Development
  source_url: https://unctad.org/publication/trade-and-development-report-2026
  secondary_source_title: Global Trade Outlook and Statistics, March 2026 · WTO
  secondary_source_url: https://www.wto.org/english/res_e/booksp_e/gtos0326_e.pdf
