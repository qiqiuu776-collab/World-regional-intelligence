- year: 1200
  date: 13th century
  period: Connected, but not equal
  title: Kilwa and a wider sea network
  copy: East African city-states such as Kilwa traded with Arabia, India and China. Gold and ivory moved from the interior; ceramics, cloth and other goods arrived by sea. Exchange brought wealth and also reflected unequal power.
  routes_label: Kilwa · Arabia · India · China
  source_title: Ruins of Kilwa Kisiwani and Songo Mnara · UNESCO
