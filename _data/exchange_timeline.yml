- year: 1000
  date: 10th century onward
  period: Monsoon worlds
  title: Ports around the Indian Ocean
  copy: Seasonal monsoon sailing connected East African port cities with Arabia, India and Southeast Asia. Swahili societies helped shape the routes and the cultural worlds around them; they were active participants, not simply endpoints of outside trade.
  routes_label: East Africa · Arabia · India · Southeast Asia
  source_title: The Historic Town and Archaeological Site of Gedi · UNESCO
