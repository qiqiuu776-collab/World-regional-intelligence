- year: 1866
  date: 1866 onward
  period: Messages cross oceans
  title: The cable changes distance
  copy: The successful transatlantic telegraph cable cut message times from weeks to minutes. The network extended unevenly, serving diplomacy and commerce while much of the world remained beyond its reach.
  routes_label: Western Europe · North America
  source_title: U.S. Diplomacy and the Telegraph · U.S. Department of State
  source_url: https://history.state.gov/milestones/1866-1898/telegraph
